name: Build LineageOS 20 ROM - Infinix X6528

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (userdebug/user/eng)'
        required: true
        default: 'userdebug'
      clean_build:
        description: 'Clean build? (true/false)'
        required: true
        default: 'false'

permissions:
  contents: write

jobs:
  build:
    runs-on: namespace-profile-speed
    timeout-minutes: 720

    steps:
      - name: Setup build environment
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git gnupg gperf imagemagick \
            lib32readline-dev lib32z1-dev liblz4-tool \
            libncurses-dev libsdl1.2-dev libssl-dev \
            libxml2 libxml2-utils lzop pngcrush rsync schedtool \
            squashfs-tools xsltproc zip zlib1g-dev \
            python3 python3-pip openjdk-11-jdk repo git-lfs pigz
          pip3 install --upgrade pip --break-system-packages

      - name: Configure git
        run: |
          git config --global user.email "build@github.com"
          git config --global user.name "GitHub Actions"
          git config --global color.ui false

      - name: Setup ccache
        run: |
          mkdir -p ~/.ccache
          ccache -M 50G
          ccache -o compression=true
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV
          echo "USE_CCACHE=1" >> $GITHUB_ENV
          echo "CCACHE_EXEC=$(which ccache)" >> $GITHUB_ENV

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-lineage20-x6528-${{ github.run_id }}
          restore-keys: |
            ccache-lineage20-x6528-

      - name: Initialize LineageOS 20 repo
        run: |
          mkdir -p ~/android/lineage
          cd ~/android/lineage
          repo init \
            --depth=1 \
            -u https://github.com/LineageOS/android.git \
            -b lineage-20.0 \
            --git-lfs

      - name: Create local manifests
        run: |
          mkdir -p ~/android/lineage/.repo/local_manifests
          cat > ~/android/lineage/.repo/local_manifests/x6528.xml << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <project name="SPEEDFIRE7/android_device_infinix_X6528"
                     path="device/infinix/X6528"
                     remote="github"
                     revision="lineage-20" />
          </manifest>
          EOF

      - name: Sync sources
        run: |
          cd ~/android/lineage
          repo sync \
            --current-branch \
            --no-clone-bundle \
            --no-tags \
            --optimized-fetch \
            -j$(nproc --all) \
            2>&1 | tee /tmp/sync.log || true
          [ -d "device/infinix/X6528" ] || (echo "device tree missing!" && exit 1)

      - name: Fix duplicate modules in Android.bp
        run: |
          BP="$HOME/android/lineage/device/infinix/X6528/rootdir/Android.bp"
          python3 - "$BP" << 'PYEOF'
          import sys, re
          path = sys.argv[1]
          with open(path, "r") as f:
              content = f.read()
          pattern = re.compile(r'prebuilt_etc\s*\{[^}]*\}', re.DOTALL)
          matches = list(pattern.finditer(content))
          seen = set()
          to_remove = []
          for m in reversed(matches):
              name_match = re.search(r'name:\s*"([^"]+)"', m.group(0))
              if not name_match:
                  continue
              name = name_match.group(1)
              if name in seen:
                  to_remove.append((m.start(), m.end()))
                  print(f"Removed duplicate: {name}")
              else:
                  seen.add(name)
          result = list(content)
          for start, end in to_remove:
              for i in range(start, end):
                  result[i] = ""
          content = "".join(result)
          with open(path, "w") as f:
              f.write(content)
          print("Done. No more duplicates.")
          PYEOF

      - name: Download vendor blobs from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/android/lineage/vendor/infinix/X6528
          mkdir -p /tmp/vendor_dl

          gh release download vendor-blobs \
            --repo SPEEDFIRE7/android_vendor_infinix_X6528 \
            --pattern "vendor_blobs*" \
            --dir /tmp/vendor_dl

          ls -lh /tmp/vendor_dl/

          if ls /tmp/vendor_dl/vendor_blobs.tar.gz.part_* &>/dev/null; then
            cat /tmp/vendor_dl/vendor_blobs.tar.gz.part_* > /tmp/vendor_dl/vendor_blobs.tar.gz
          fi

          tar -I pigz -xf /tmp/vendor_dl/vendor_blobs.tar.gz \
            -C ~/android/lineage/vendor/infinix/X6528

          ls ~/android/lineage/vendor/infinix/X6528/

      - name: Remove vendor vintf manifests that duplicate in-tree ones
        run: |
          cat > /tmp/dedupe_vintf.py << 'PYEOF'
          import os, re, sys

          TOP = os.path.expanduser("~/android/lineage")
          VENDOR = os.path.join(TOP, "vendor/infinix/X6528")
          BP = os.path.join(VENDOR, "Android.bp")
          MK = os.path.join(VENDOR, "X6528-vendor.mk")
          ALWAYS = {"face-default.xml"}

          def fix_continuations(ls):
              res = list(ls)
              for k in range(len(res) - 1):
                  nxt = res[k + 1]
                  if res[k].rstrip().endswith("\\") and (nxt.strip() == "" or not nxt[0].isspace()):
                      res[k] = res[k].rstrip()[:-1].rstrip()
              if res and res[-1].rstrip().endswith("\\"):
                  res[-1] = res[-1].rstrip()[:-1].rstrip()
              return res


          lines = open(BP).read().split("\n")

          # 1) parse top-level blocks
          blocks = []  # (start, end, text)
          i = 0
          while i < len(lines):
              l = lines[i]
              if l and not l[0].isspace() and l.rstrip().endswith("{"):
                  j = i
                  while j < len(lines) and lines[j].rstrip() != "}":
                      j += 1
                  blocks.append((i, j, "\n".join(lines[i:j + 1])))
                  i = j + 1
              else:
                  i += 1

          # 2) vendor vintf-manifest modules -> xml basename
          cand = {}  # module name -> (xml basename, start, end)
          for s, e, t in blocks:
              if not re.search(r'sub_dir:\s*"vintf/manifest"', t):
                  continue
              n = re.search(r'name:\s*"([^"]+)"', t)
              src = re.search(r'src:\s*"([^"]+)"', t)
              fn = re.search(r'filename:\s*"([^"]+)"', t)
              if not n or not src:
                  continue
              base = os.path.basename(fn.group(1) if fn else src.group(1))
              cand[n.group(1)] = (base, s, e)
          print(f"vendor vintf manifest modules: {len(cand)}")

          # 3) collect every .xml basename referenced by build files OUTSIDE the vendor/device trees
          wanted = {v[0] for v in cand.values()}
          found = {}
          skip_prefix = (os.path.join(TOP, "out"), VENDOR,
                         os.path.join(TOP, "device/infinix"), os.path.join(TOP, ".repo"))
          xml_re = re.compile(r'([\w./@+-]+\.xml)')
          for root, dirs, files in os.walk(TOP):
              if root.startswith(skip_prefix):
                  dirs[:] = []
                  continue
              dirs[:] = [d for d in dirs if d not in (".git", "out", ".repo")]
              for f in files:
                  if not f.endswith((".bp", ".mk")):
                      continue
                  p = os.path.join(root, f)
                  try:
                      txt = open(p, errors="ignore").read()
                  except OSError:
                      continue
                  for m in xml_re.finditer(txt):
                      b = os.path.basename(m.group(1))
                      if b in wanted and b not in found:
                          found[b] = os.path.relpath(p, TOP)

          # 4) decide
          drop = {name: v for name, v in cand.items()
                  if v[0] in found or v[0] in ALWAYS}
          for name, (b, s, e) in sorted(drop.items()):
              print(f"DROP {name} ({b}) - also defined in {found.get(b, 'forced list')}")

          # 5) rewrite Android.bp without those blocks
          kill = set()
          for _, s, e in drop.values():
              kill.update(range(s, e + 1))
          open(BP, "w").write("\n".join(l for k, l in enumerate(lines) if k not in kill))

          # 6) remove PRODUCT_PACKAGES entries
          mk = open(MK).read().split("\n")
          names = set(drop)
          mk = [l for l in mk if not (re.fullmatch(r'\s*(\S+)\s*\\?\s*', l) and
                                      re.fullmatch(r'\s*(\S+)\s*\\?\s*', l).group(1).rstrip("\\") in names)]
          open(MK, "w").write("\n".join(fix_continuations(mk)))
          print(f"removed {len(drop)} module(s)")
          PYEOF
          python3 /tmp/dedupe_vintf.py

      - name: Resolve remaining duplicate install targets (iterative)
        run: |
          cat > /tmp/rm_target.py << 'PYEOF'
          import os, re, sys
          B = sys.argv[1]
          VENDOR = os.path.expanduser("~/android/lineage/vendor/infinix/X6528")

          def fix_continuations(ls):
              res = list(ls)
              for k in range(len(res) - 1):
                  nxt = res[k + 1]
                  if res[k].rstrip().endswith("\\") and (nxt.strip() == "" or not nxt[0].isspace()):
                      res[k] = res[k].rstrip()[:-1].rstrip()
              if res and res[-1].rstrip().endswith("\\"):
                  res[-1] = res[-1].rstrip()[:-1].rstrip()
              return res

          BP, MK = os.path.join(VENDOR, "Android.bp"), os.path.join(VENDOR, "X6528-vendor.mk")

          lines = open(BP).read().split("\n")
          blocks, i = [], 0
          while i < len(lines):
              l = lines[i]
              if l and not l[0].isspace() and l.rstrip().endswith("{"):
                  j = i
                  while j < len(lines) and lines[j].rstrip() != "}":
                      j += 1
                  blocks.append((i, j, "\n".join(lines[i:j + 1])))
                  i = j + 1
              else:
                  i += 1

          names, kill = set(), set()
          for s, e, t in blocks:
              n = re.search(r'name:\s*"([^"]+)"', t)
              src = re.search(r'src:\s*"([^"]+)"', t)
              fn = re.search(r'filename:\s*"([^"]+)"', t)
              base = os.path.basename(fn.group(1)) if fn else (os.path.basename(src.group(1)) if src else None)
              if n and base == B:
                  names.add(n.group(1))
                  kill.update(range(s, e + 1))
                  print(f"  removing Android.bp module {n.group(1)}")
          open(BP, "w").write("\n".join(l for k, l in enumerate(lines) if k not in kill))

          mk = open(MK).read().split("\n")
          out, hit = [], 0
          for l in mk:
              m = re.fullmatch(r'\s*(\S+?)\s*\\?\s*', l)
              if m and m.group(1) in names:
                  hit += 1
                  continue
              if ":" in l and re.search(r'[:/]' + re.escape(B) + r'\s*\\?\s*$', l):
                  hit += 1
                  print(f"  removing copy rule: {l.strip()}")
                  continue
              out.append(l)
          open(MK, "w").write("\n".join(fix_continuations(out)))
          print(f"  modules removed: {len(names)}, mk lines removed: {hit}")
          sys.exit(0 if (names or hit) else 3)
          PYEOF

          cd ~/android/lineage
          source build/envsetup.sh
          lunch lineage_X6528-${{ github.event.inputs.build_type }}

          for n in $(seq 1 25); do
            echo "=== Check #$n ==="
            if m nothing > /tmp/dup_check.log 2>&1; then
              echo "No more duplicate targets."
              break
            fi
            T=$(grep -oP "overriding commands for target \`\K[^']+" /tmp/dup_check.log | head -1)
            if [ -z "$T" ]; then
              echo "Failed with a different error:"
              grep -n -E "FAILED|error:" /tmp/dup_check.log | head -20
              tail -30 /tmp/dup_check.log
              exit 1
            fi
            echo "Duplicate target: $T"
            python3 /tmp/rm_target.py "$(basename "$T")" || {
              echo "Could not find a vendor definition for $(basename "$T"); stopping."
              exit 1
            }
          done

      - name: Show prebuilt kernel config
        run: |
          cd ~/android/lineage
          grep -rn -E "PREBUILT_KERNEL|FORCE_PREBUILT|PREBUILT_DTB|PREBUILT_DTBO" \
            device/infinix/X6528/BoardConfig.mk || echo "(no prebuilt kernel lines found!)"
          ls -lh device/infinix/X6528/prebuilts/ || true

      - name: Clean if requested
        if: github.event.inputs.clean_build == 'true'
        run: |
          cd ~/android/lineage
          source build/envsetup.sh
          lunch lineage_X6528-${{ github.event.inputs.build_type }}
          make clean

      - name: Build LineageOS
        run: |
          cd ~/android/lineage
          source build/envsetup.sh
          lunch lineage_X6528-${{ github.event.inputs.build_type }}
          make bacon -j$(nproc --all) 2>&1 | tee /tmp/build.log
          ls -lh out/target/product/X6528/*.zip

      - name: Upload ROM to release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd ~/android/lineage
          ZIP=$(ls out/target/product/X6528/lineage-*.zip 2>/dev/null | head -1)
          [ -z "$ZIP" ] && echo "No zip found!" && exit 1

          SIZE=$(du -sh "$ZIP" | cut -f1)
          DATE=$(date +%Y%m%d)
          TAG="lineage-20-${DATE}"

          gh release create "$TAG" "$ZIP" \
            --repo SPEEDFIRE7/android_vendor_infinix_X6528 \
            --title "LineageOS 20 - Infinix X6528 (${DATE})" \
            --notes "## LineageOS 20 — Infinix Hot 40i (X6528)

          - **Device**: Infinix Hot 40i (X6528)
          - **Chipset**: Unisoc T606
          - **Android**: 13 (LineageOS 20)
          - **Build type**: ${{ github.event.inputs.build_type }}
          - **Build date**: ${DATE}
          - **Size**: ${SIZE}

          ### Installation
          1. Boot to recovery
          2. Flash the ZIP
          3. Wipe data if upgrading from stock"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_id }}
          path: /tmp/build.log
          retention-days: 7
