name: Build LineageOS 20 ROM - Infinix X6528

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (userdebug/user/eng)'
        required: true
        default: 'userdebug'
      clean_build:
        description: 'Clean build? (true/false)'
        required: true
        default: 'false'

permissions:
  contents: write

jobs:
  build:
    runs-on: namespace-profile-speed
    timeout-minutes: 720

    steps:
      - name: Setup build environment
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bc bison build-essential ccache curl flex \
            g++-multilib gcc-multilib git gnupg gperf imagemagick \
            lib32readline-dev lib32z1-dev liblz4-tool \
            libncurses-dev libsdl1.2-dev libssl-dev \
            libxml2 libxml2-utils lzop pngcrush rsync schedtool \
            squashfs-tools xsltproc zip zlib1g-dev \
            python3 python3-pip openjdk-11-jdk repo git-lfs pigz
          pip3 install --upgrade pip --break-system-packages

      - name: Configure git
        run: |
          git config --global user.email "build@github.com"
          git config --global user.name "GitHub Actions"
          git config --global color.ui false

      - name: Setup ccache
        run: |
          mkdir -p ~/.ccache
          ccache -M 50G
          ccache -o compression=true
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV
          echo "USE_CCACHE=1" >> $GITHUB_ENV
          echo "CCACHE_EXEC=$(which ccache)" >> $GITHUB_ENV

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-lineage20-x6528-${{ github.run_id }}
          restore-keys: |
            ccache-lineage20-x6528-

      - name: Initialize LineageOS 20 repo
        run: |
          mkdir -p ~/android/lineage
          cd ~/android/lineage
          repo init \
            --depth=1 \
            -u https://github.com/LineageOS/android.git \
            -b lineage-20.0 \
            --git-lfs

      - name: Create local manifests
        run: |
          mkdir -p ~/android/lineage/.repo/local_manifests
          cat > ~/android/lineage/.repo/local_manifests/x6528.xml << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <project name="SPEEDFIRE7/android_device_infinix_X6528"
                     path="device/infinix/X6528"
                     remote="github"
                     revision="lineage-20" />
          </manifest>
          EOF

      - name: Sync sources
        run: |
          cd ~/android/lineage
          set -o pipefail
          repo sync \
            --current-branch \
            --no-clone-bundle \
            --no-tags \
            --optimized-fetch \
            -j$(nproc --all) \
            2>&1 | tee /tmp/sync.log
          [ -d "device/infinix/X6528" ] || (echo "device tree missing!" && exit 1)

      - name: Fix duplicate modules in Android.bp
        run: |
          BP="$HOME/android/lineage/device/infinix/X6528/rootdir/Android.bp"
          python3 - "$BP" << 'PYEOF'
          import sys, re
          path = sys.argv[1]
          with open(path, "r") as f:
              content = f.read()
          pattern = re.compile(r'prebuilt_etc(?:_xml)?\s*\{[^}]*\}', re.DOTALL)
          matches = list(pattern.finditer(content))
          seen = set()
          to_remove = []
          for m in reversed(matches):
              name_match = re.search(r'name:\s*"([^"]+)"', m.group(0))
              if not name_match:
                  continue
              name = name_match.group(1)
              if name in seen:
                  to_remove.append((m.start(), m.end()))
                  print(f"Removed duplicate: {name}")
              else:
                  seen.add(name)
          result = list(content)
          for start, end in to_remove:
              for i in range(start, end):
                  result[i] = ""
          content = "".join(result)
          with open(path, "w") as f:
              f.write(content)
          print("Done. No more duplicates.")
          PYEOF

      - name: Download vendor blobs from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/android/lineage/vendor/infinix/X6528
          mkdir -p /tmp/vendor_dl

          gh release download vendor-blobs \
            --repo SPEEDFIRE7/android_vendor_infinix_X6528 \
            --pattern "vendor_blobs*" \
            --dir /tmp/vendor_dl

          ls -lh /tmp/vendor_dl/

          if ls /tmp/vendor_dl/vendor_blobs.tar.gz.part_* &>/dev/null; then
            cat /tmp/vendor_dl/vendor_blobs.tar.gz.part_* > /tmp/vendor_dl/vendor_blobs.tar.gz
          fi

          tar -I pigz -xf /tmp/vendor_dl/vendor_blobs.tar.gz \
            -C ~/android/lineage/vendor/infinix/X6528

          ls ~/android/lineage/vendor/infinix/X6528/

      - name: Remove face-default duplicate (module + package entry)
        run: |
          cd ~/android/lineage
          V=vendor/infinix/X6528

          echo "=== Before ==="
          grep -rn "face-default" device/infinix/X6528 $V \
            --include=*.mk --include=*.bp || true
          sed -n '180,190p' device/infinix/X6528/BoardConfig.mk

          # 1) remove the prebuilt_etc "face-default" module from vendor Android.bp
          python3 - "$V/Android.bp" << 'PYEOF'
          import re, sys
          p = sys.argv[1]
          s = open(p).read()
          s2, n = re.subn(r'prebuilt_etc(?:_xml)?\s*\{[^}]*?name:\s*"face-default"[^}]*?\}\s*', '', s, flags=re.DOTALL)
          open(p, 'w').write(s2)
          print(f"removed {n} face-default module(s)")
          PYEOF

          # 2) remove it from PRODUCT_PACKAGES
          sed -i '/^[[:space:]]*face-default[[:space:]]*\\$/d' $V/X6528-vendor.mk

          echo "=== After ==="
          grep -rn "face-default" device/infinix/X6528 $V \
            --include=*.mk --include=*.bp || echo "(none)"

      - name: Clean if requested
        if: github.event.inputs.clean_build == 'true'
        run: |
          cd ~/android/lineage
          source build/envsetup.sh
          lunch lineage_X6528-${{ github.event.inputs.build_type }}
          make clean

      - name: Verify prebuilt kernel (skip kernel compilation)
        run: |
          cd ~/android/lineage
          test -s device/infinix/X6528/prebuilts/kernel || { echo "Prebuilt kernel is missing"; exit 1; }
          test -s device/infinix/X6528/prebuilts/dtb.img || { echo "Prebuilt DTB is missing"; exit 1; }
          echo "Using the device-tree prebuilt kernel; kernel source compilation is disabled."

      - name: Build LineageOS (without building kernel)
        run: |
          cd ~/android/lineage
          export TARGET_FORCE_PREBUILT_KERNEL=true
          source build/envsetup.sh
          lunch lineage_X6528-${{ github.event.inputs.build_type }}
          set -o pipefail
          make bacon TARGET_FORCE_PREBUILT_KERNEL=true -j$(nproc --all) 2>&1 | tee /tmp/build.log
          ls -lh out/target/product/X6528/*.zip

      - name: Upload ROM to release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd ~/android/lineage
          ZIP=$(ls out/target/product/X6528/lineage-*.zip 2>/dev/null | head -1)
          [ -z "$ZIP" ] && echo "No zip found!" && exit 1
          TAG="lineage20-x6528-$(date +%Y%m%d-%H%M)"
          gh release create "$TAG" "$ZIP" \
            --repo "${{ github.repository }}" \
            --title "LineageOS 20 X6528 - $(date +%Y-%m-%d)" \
            --notes "Build type: ${{ github.event.inputs.build_type }}"
